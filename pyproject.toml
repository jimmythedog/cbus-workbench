[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cbus-workbench"
version = "0.1.0a1"
requires-python = ">=3.14"
dependencies = [
    "pyside6>=6.12.0",
    "pyyaml>=6.0.3",
]

[tool.cbus-workbench]
mmc_version = "v0.23.2"

[tool.hatch.build.targets.wheel]
packages = ["workbench"]
